[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-collector"
version = "0.1.0"
description = "Public perpetual-market collector for Bybit, Aster, GRVT and Hyperliquid"
requires-python = ">=3.9"
dependencies = [
  "aiohttp>=3.9,<4",
  "boto3>=1.34,<2",
  "pyarrow>=15,<22",
  "sortedcontainers>=2.4,<3",
]

[project.scripts]
quant-collector = "quant_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
